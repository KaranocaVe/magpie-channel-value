<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="channel-value-token" content="__PAGE_TOKEN__">
  <title>渠道性价比</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <section class="toolbar" aria-label="筛选">
      <label>模型 <select id="model" disabled></select></label>
      <div class="periods" role="group" aria-label="时间范围">
        <button type="button" data-period="today" aria-pressed="false">今天</button>
        <button type="button" data-period="last:24h" aria-pressed="true">24 小时</button>
        <button type="button" data-period="7d" aria-pressed="false">7 天</button>
        <button type="button" data-period="30d" aria-pressed="false">30 天</button>
      </div>
      <label class="muted"><input type="checkbox" id="show-all"> 显示未配置倍率的渠道</label>
      <button id="refresh" type="button">刷新</button>
    </section>

    <p id="notice" role="status" aria-live="polite">正在读取 Magpie 用量…</p>
    <div id="results" hidden>
      <section aria-label="渠道对比">
        <div class="table-caption">
          <div id="summary" class="winner-summary" hidden>
            <small>单位扣帐最低</small>
            <strong id="winner"></strong>
            <span id="winner-price"></span>
            <small id="winner-detail"></small>
          </div>
          <small id="as-of"></small>
        </div>
        <div class="table-wrap" role="region" aria-label="渠道比较表" tabindex="0">
          <table>
            <thead>
              <tr>
                <th scope="col">渠道</th>
                <th scope="col" data-sort="unit" aria-sort="ascending"><button type="button">扣帐 / 百万输入 <span aria-hidden="true">↑</span></button></th>
                <th scope="col" data-sort="hit"><button type="button">缓存命中</button></th>
                <th scope="col" data-sort="total"><button type="button">扣帐合计</button></th>
                <th scope="col" data-sort="calls"><button type="button">请求数</button></th>
                <th scope="col" data-sort="ttft"><button type="button">首 token</button></th>
                <th scope="col" data-sort="decode"><button type="button">生成速度</button></th>
              </tr>
            </thead>
            <tbody id="channels"></tbody>
          </table>
        </div>
        <p id="empty" hidden>当前筛选没有渠道。可切换时间、模型，或显示未配置倍率的渠道。</p>
        <p class="footnote">扣帐估算 = Magpie 用量成本 × 渠道倍率。单位扣帐以包含缓存的全部输入为分母，成本包含输出，以及 Magpie 识别的长上下文和速度档位。排序按观测流量计算。</p>
      </section>

      <details id="rate-panel">
        <summary>渠道倍率</summary>
        <p class="muted">默认从渠道名称末尾的小数倍率读取。手动倍率覆盖名称，对所选时间范围内的记录统一生效。</p>
        <div id="rates">
          <div class="rate-fields" id="rate-fields"></div>
          <div class="rate-actions">
            <button id="save-rates" type="button">保存倍率</button>
            <small id="rate-status" role="status"></small>
          </div>
        </div>
      </details>
    </div>
  </main>
</body>
</html>
